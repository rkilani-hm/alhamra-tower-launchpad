    <!--
      Al Hamra Business Tower — Content Studio (Sveltia CMS)
      ─────────────────────────────────────────────────────────────
      Sveltia CMS is a lightweight, Git-based content editor (the modern
      successor to Decap/Netlify CMS). It runs entirely in the browser,
      reads and writes the site's content files directly in the GitHub
      repository, and requires no server of its own.

      • Editors sign in with a free GitHub account (one click).
      • Saving a change opens it for review (editorial workflow).
      • The manager approves (merges) to publish — Lovable then redeploys.

      Configuration lives in ./config.yml
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
