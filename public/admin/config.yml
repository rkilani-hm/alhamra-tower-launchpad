# ════════════════════════════════════════════════════════════════════════
# Al Hamra Business Tower — Content Studio configuration (Sveltia CMS)
# ────────────────────────────────────────────────────────────────────────
# This file tells the Content Studio what is editable and how to show it.
# Content is stored as JSON in the site repository (src/locales/en.json and
# src/locales/ar.json) and as images under public/assets. Editors never see
# code — only friendly forms, with English and Arabic side by side.
#
# WORKFLOW (editor vs. approver):
#   publish_mode: editorial_workflow turns every save into a review item.
#   Editors can create and update drafts but cannot publish. The manager
#   approves (merges) to make changes live; Lovable then redeploys.
# ════════════════════════════════════════════════════════════════════════

backend:
  name: github
  repo: rkilani-hm/alhamra-tower-launchpad
  branch: main
  # OAuth sign-in via the Sveltia auth worker (set base_url after deploying
  # the free Cloudflare Worker — see ADMIN-RUNBOOK.md). Until then, editors
  # can use "Sign in with Token" (a GitHub personal access token).
  # base_url: https://YOUR-AUTH-WORKER.workers.dev

# Editorial workflow: edits become review items; only an approver merges.
publish_mode: editorial_workflow

# Where uploaded images are written, and the public path the site uses.
media_folder: "public/assets"
public_folder: "/assets"

# Bilingual: every text field gets an EN and an AR input side by side.
i18n:
  structure: multiple_files
  locales: [en, ar]
  default_locale: en

collections:
  # ──────────────────────────────────────────────────────────────────────
  # SITE-WIDE: navigation, footer, language labels, meta
  # Stored as discrete keys inside the locale files via the "data" file
  # collection. Each entry below maps to one top-level key.
  # ──────────────────────────────────────────────────────────────────────
  - name: site
    label: "Site-wide (menus, footer, meta)"
    description: "Header navigation, footer, language labels, and page metadata."
    editor:
      preview: false
    files:
      - name: nav
        label: "Header Navigation"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - { name: nav, label: "Navigation labels", widget: object, i18n: true, fields: [
              { name: tower, label: "The Tower", widget: string, i18n: true, required: false },
              { name: business, label: "Business", widget: string, i18n: true, required: false },
              { name: experience, label: "Experience", widget: string, i18n: true, required: false },
              { name: leasing, label: "Leasing", widget: string, i18n: true, required: false },
              { name: inquiry, label: "Leasing Inquiry (button)", widget: string, i18n: true, required: false },
            ] }

      - name: footer
        label: "Footer"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - { name: footer, label: "Footer content", widget: object, i18n: true, fields: [
              { name: tagline, label: "Tagline", widget: text, i18n: true, required: false },
              { name: rights, label: "Rights / copyright line", widget: string, i18n: true, required: false },
              { name: address, label: "Address", widget: text, i18n: true, required: false },
            ] }

  # ──────────────────────────────────────────────────────────────────────
  # HOMEPAGE
  # ──────────────────────────────────────────────────────────────────────
  - name: homepage
    label: "Homepage"
    description: "Hero, statistics counters, and the homepage narrative sections."
    editor:
      preview: false
    files:
      - name: hero
        label: "Hero"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - { name: hero, label: "Hero", widget: object, i18n: true, fields: [
              { name: location, label: "Location eyebrow", widget: string, i18n: true, required: false },
              { name: title, label: "Title", widget: string, i18n: true, required: false },
              { name: subtitle, label: "Subtitle", widget: text, i18n: true, required: false },
              { name: cta, label: "Call to action", widget: string, i18n: true, required: false },
            ] }

      - name: stats
        label: "Statistics Counters"
        file: "src/locales/{{locale}}.json"
        i18n: true
        description: "The animated numbers. Each counter rolls from Start to End by Step, then shows the Display value. Edit Label and Sub for the caption."
        fields:
          - name: stats
            label: "Statistics"
            widget: object
            i18n: true
            fields:
              - { name: kicker, label: "Section eyebrow", widget: string, i18n: true, required: false }
              - name: counters
                label: "Counters (animated numbers)"
                widget: list
                i18n: true
                label_singular: "Counter"
                summary: "{{fields.display}} — {{fields.key}}"
                fields:
                  - { name: key, label: "Key (do not change)", widget: string, i18n: false }
                  - { name: start, label: "Start (count from)", widget: number, value_type: int, default: 0, i18n: false }
                  - { name: end, label: "End (count to)", widget: number, value_type: int, i18n: false }
                  - { name: step, label: "Step (increment)", widget: number, value_type: int, default: 1, i18n: false }
                  - { name: display, label: "Display value (final shown text)", widget: string, i18n: true }
                  - { name: unit, label: "Unit suffix (e.g. m, m²)", widget: string, i18n: true, required: false }
              - name: items
                label: "Counter captions"
                widget: object
                i18n: true
                fields:
                  - { name: height,    label: "Height — label/sub",     widget: object, i18n: true, fields: [ { name: label, label: Label, widget: string, i18n: true }, { name: sub, label: Sub, widget: text, i18n: true } ] }
                  - { name: limestone, label: "Limestone — label/sub",  widget: object, i18n: true, fields: [ { name: label, label: Label, widget: string, i18n: true }, { name: sub, label: Sub, widget: text, i18n: true } ] }
                  - { name: floors,    label: "Floors — label/sub",     widget: object, i18n: true, fields: [ { name: label, label: Label, widget: string, i18n: true }, { name: sub, label: Sub, widget: text, i18n: true } ] }
                  - { name: skyLounge, label: "Sky Lounge — label/sub", widget: object, i18n: true, fields: [ { name: label, label: Label, widget: string, i18n: true }, { name: sub, label: Sub, widget: text, i18n: true } ] }
                  - { name: year,      label: "Year — label/sub",       widget: object, i18n: true, fields: [ { name: label, label: Label, widget: string, i18n: true }, { name: sub, label: Sub, widget: text, i18n: true } ] }

      - name: homeNarrative
        label: "Homepage Sections (intro, gulf, invitation)"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - { name: intro, label: "Intro section", widget: object, i18n: true, required: false, fields: [
              { name: kicker, label: Eyebrow, widget: string, i18n: true, required: false },
              { name: title, label: Title, widget: text, i18n: true, required: false },
              { name: body, label: Body, widget: text, i18n: true, required: false },
            ] }
          - { name: gulf, label: "Gulf section", widget: object, i18n: true, required: false, fields: [
              { name: kicker, label: Eyebrow, widget: string, i18n: true, required: false },
              { name: title, label: Title, widget: text, i18n: true, required: false },
              { name: body, label: Body, widget: text, i18n: true, required: false },
            ] }

  # ──────────────────────────────────────────────────────────────────────
  # MIGRATED CONTENT BLOCKS (content.*) — the richer page sections.
  # These use the JSON editor so the full nested structure stays editable
  # and safe. Each is one section of the site.
  # ──────────────────────────────────────────────────────────────────────
  - name: pages
    label: "Page Content"
    description: "Detailed content for the Tower and Experience pages. English and Arabic shown together."
    editor:
      preview: false
    files:
      - name: invitation
        label: "Homepage — Invitation / Leasing"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: invitation, label: "Invitation block", widget: json, i18n: true }

      - name: architecture
        label: "Homepage — Architecture"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: architecture, label: "Architecture block", widget: json, i18n: true }

      - name: towerOverview
        label: "Tower — Overview"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: towerOverview, label: "Tower Overview block", widget: json, i18n: true }

      - name: towerDesign
        label: "Tower — Design & Engineering"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: towerDesign, label: "Tower Design block", widget: json, i18n: true }

      - name: towerSustain
        label: "Tower — Sustainability"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: towerSustain, label: "Sustainability block", widget: json, i18n: true }

      - name: towerRising
        label: "Tower — Rising (Construction)"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: towerRising, label: "Tower Rising block", widget: json, i18n: true }

      - name: businessCentre
        label: "Experience — Business Centre"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: businessCentre, label: "Business Centre block", widget: json, i18n: true }

      - name: alHamraHotel
        label: "Experience — Al Hamra Hotel"
        file: "src/locales/{{locale}}.json"
        i18n: true
        fields:
          - name: content
            label: " "
            widget: object
            i18n: true
            fields:
              - { name: alHamraHotel, label: "Al Hamra Hotel block", widget: json, i18n: true }

  # ──────────────────────────────────────────────────────────────────────
  # IMAGE LIBRARY — browse, upload, and replace any image on the site.
  # Image management uses Sveltia's built-in Assets view (top toolbar):
  # upload, replace, and browse everything under public/assets there.
  # To swap an image used inside a section, edit that section (Page
  # Content) and pick the new image from the asset dialog.
  # ──────────────────────────────────────────────────────────────────────
  - name: media
    label: "Image Library"
    description: "Use the Assets button in the top toolbar to upload, browse, and replace images. To change an image shown in a section, edit that section under Page Content."
    files:
      - name: library
        label: "How to manage images"
        file: "src/locales/en.json"
        i18n: false
        fields:
          - { name: meta, label: "Reference", widget: object, fields: [
              { name: note, label: "Note", widget: string, required: false, default: "Use the Assets button (top bar) to upload and manage images." },
            ] }
